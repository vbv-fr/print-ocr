/* ===================================================================
   BASE — both products share this reset.
   From: frinksvision-frontend/src/index.css:1-30,
         frinksedge-deployment-frontend/src/index.css:5-38
   =================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;font-size:16px;color:#000;overflow:hidden}
:root{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  --f-primary:#ff4301;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;--red-500:#ef4444}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

/* ===================================================================
   PROTOTYPE CHROME — not product UI. Deliberately neutral, thin, monospace.
   =================================================================== */
#proto-bar{position:fixed;top:0;left:0;right:0;height:34px;z-index:10000;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:#2b2d31;color:#c9ccd1;font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border-bottom:1px solid #111}
#proto-bar .pb-tag{padding:3px 6px;border:1px dashed #6b6f76;border-radius:3px;color:#9aa0a6;letter-spacing:.04em}
#proto-bar .pb-tab{padding:6px 10px;border-radius:3px;color:#c9ccd1;font:inherit}
#proto-bar .pb-tab:hover{background:#3a3d42}
#proto-bar .pb-tab.on{background:#e8eaed;color:#111}
#proto-bar .pb-sp{flex:1}
#proto-bar .pb-link{color:#9aa0a6;font:inherit;text-decoration:underline}
.app{position:fixed;top:34px;left:0;right:0;bottom:0;overflow:hidden;background:#fff}

/* ===================================================================
   SHARED CONTROLS — Button / Input / SelectInput / Table / Toast.
   Both products ship near-identical copies:
     Button:      frinksvision-frontend/src/shared/ui/Button.tsx:37-92
                  frinksedge-deployment-frontend/src/shared/ui/Button.jsx:14-53
     Input:       .../shared/ui/Input.tsx:15-41 | Input.jsx:15-26
     SelectInput: .../shared/ui/SelectInput.tsx:155-219 | SelectInput.jsx:127-205
     Table:       .../shared/ui/Table.tsx:17,62,153 | Table.jsx:13-135
     Toast:       react-hot-toast defaults (top-center)
   =================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:20px;transition:opacity .15s,background-color .15s}
.btn-lg{font-size:14px;padding:8px 24px;border-radius:6px}
.btn-md{font-size:14px;padding:6px 12px;border-radius:6px}
.btn-xs{font-size:12px;padding:4px 8px;border-radius:2px;line-height:16px}
.btn-flat{background:var(--f-primary);color:#fff}
.btn-flat:hover{opacity:.7}
.btn-border{background:transparent;border-color:var(--f-primary);color:var(--f-primary)}
.btn-border:hover{opacity:.7}
.btn:disabled{background:var(--gray-300)!important;color:var(--gray-500)!important;border-color:transparent!important;cursor:not-allowed;opacity:1!important}

.inp{display:block;width:100%;border:1px solid var(--gray-300);border-radius:6px;background:#fff;padding:8px 12px;font-size:14px;line-height:20px;outline:1px solid transparent}
.inp::placeholder{color:var(--gray-400)}
.inp:focus{border-color:var(--f-primary);outline:2px solid var(--f-primary);outline-offset:-1px}
.inp.xs{padding:4px 8px}
.inp.err{border-color:var(--red-500)}
.inp[readonly]{background:var(--gray-50);color:var(--gray-700)}
.err-text{font-size:12px;color:var(--red-500);margin-top:4px}

.sel{position:relative;width:100%}
.sel-btn{position:relative;width:100%;min-width:95px;border:1px solid var(--gray-300);border-radius:6px;background:#fff;padding:8px 40px 8px 12px;text-align:left;font-size:14px;line-height:20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sel-btn:focus{outline:none;border-color:var(--f-primary);box-shadow:0 0 0 1px var(--f-primary)}
.sel-btn .ph{color:var(--gray-500)}
.sel-btn svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--gray-400)}
.sel-btn:disabled{background:var(--gray-50);color:var(--gray-500);cursor:not-allowed}
.sel-list{position:fixed;z-index:100050;max-height:240px;overflow:auto;background:#fff;border-radius:6px;padding:4px 0;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.05)}
.sel-opt{position:relative;padding:8px 16px 8px 40px;font-size:14px;cursor:pointer;user-select:none}
.sel-opt:hover,.sel-opt.on{background:var(--f-primary);color:#fff}
.sel-opt.on{font-weight:600}
.sel-opt.on::before{content:'';position:absolute;left:14px;top:50%;width:10px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(-45deg)}

.tbl{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:6px;border:1px solid var(--gray-200)}
.tbl th{background:var(--f-primary);color:#fff;font-weight:500;font-size:16px;text-align:center;padding:16px 8px;position:relative}
.tbl th:not(:last-child)::after{content:'';position:absolute;right:0;top:10px;bottom:10px;width:2px;background:#fff}
.tbl td{padding:8px;text-align:center;border-top:1px solid var(--gray-200);background:#fff;vertical-align:middle}

#toasts{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:10001;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:#fff;color:#363636;padding:8px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);font-size:14px;max-width:420px;animation:tin .25s ease}
.toast i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:700}
.toast.ok i{background:#61d345}.toast.bad i{background:#ff4b4b}.toast.info i{background:#6b7280}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.v-side{position:absolute;left:0;top:0;bottom:0;width:80px;background:#1e1c1c;border-right:1px solid var(--gray-300);box-shadow:0 4px 6px -1px rgba(0,0,0,.1);padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:30}
.v-side .logo{width:58px;height:40px;overflow:hidden;margin-bottom:18px}
.v-side .logo svg{width:230px;height:52px;transform-origin:0 0;transform:scale(1.1) translate(-10px,-8px)}
.v-side .it{width:48px;height:40px;border-radius:6px;display:grid;place-items:center;color:#fff}
.v-side .it:hover,.v-side .it.on{background:rgba(255,255,255,.2)}
.v-side .it svg{width:22px;height:22px}
.v-main{position:absolute;left:80px;right:0;top:0;bottom:0;display:flex;flex-direction:column}
.v-heading{margin-top:4px;height:60px;padding:16px 20px;background:#fff;display:flex;align-items:center;justify-content:space-between}
.v-heading h1{font-size:30px;line-height:36px;font-weight:500}

.pat-tbl input{width:100%;border:1px solid var(--gray-300);border-radius:5px;padding:5px 8px;font-size:12px}
.pat-tbl input.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.03em}
.pat-tbl input.err{border-color:var(--red-500)}
.pat-tbl input:focus{outline:2px solid var(--f-primary);outline-offset:-1px;border-color:var(--f-primary)}
.pat-tbl .pe{font-size:11px;color:var(--red-500);line-height:1.3;padding-top:2px}
.pat-tbl tr.hit td:first-child{box-shadow:inset 3px 0 0 #56b733}
.fld-res{padding:8px 14px;font-size:12px;background:#fff}
.syntax{font-size:11px;color:var(--gray-500);line-height:1.6;margin-top:8px}
.syntax code{font-family:ui-monospace,Menlo,monospace;background:var(--gray-100);border-radius:3px;padding:0 4px;color:var(--gray-800)}
.v-img-pane{flex:1;min-width:0;background:#fff;display:flex;flex-direction:column;padding:14px;gap:8px;border-right:1px solid #e3e5e5}
.v-img-pane .cap{font-size:14px;font-weight:500}
.v-img-pane .frame{position:relative;border:2px solid #ff4301;border-radius:4px;overflow:hidden;background:#f3f3f3}
.v-img-pane .frame img{display:block;width:100%;height:auto}
.v-img-pane .sa{position:absolute;border:2px solid #ff4301;background:rgba(255,67,1,.08)}
.v-img-pane .sa span{position:absolute;left:-2px;top:-20px;background:#ff4301;color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.module-section.narrow{flex:0 0 380px}
.sel-btn.sm{padding:8px 36px 8px 8px;font-size:12px}
.tbl-title{font-size:14px;font-weight:500}
.flex-col-2{display:flex;flex-direction:column;gap:8px}
.gt-main td{vertical-align:top}
.lbl-ro{width:100%;border:1px solid var(--gray-200);background:var(--gray-50);border-radius:5px;padding:8px;font-size:12px;color:var(--gray-700);display:flex;align-items:center;justify-content:center}
.gt-in{width:100%;border-radius:5px;border:1px solid var(--gray-300);background:#fff;padding:8px;font-size:12px;color:#000}
.gt-in.err{border-color:var(--red-500)}
.gt-in:focus{outline:2px solid var(--f-primary);outline-offset:-1px;border-color:var(--f-primary)}
.cell-err{min-height:16px;font-size:11px;line-height:16px;color:var(--red-500);text-align:left}
.rx-box{display:flex;align-items:center;gap:10px;border:1px dashed var(--gray-300);border-radius:5px;padding:6px 8px;background:#fff}
.rx-sum{flex:1;min-width:0;font:12px ui-monospace,Menlo,monospace;color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.mono{font-family:ui-monospace,Menlo,monospace}
.pv2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.pv2 .cap{font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:4px}
.pv2 canvas{width:100%;height:auto;display:block;border:1px solid var(--gray-200);background:#1b1c1e}
@media (max-width:900px){.pv2{grid-template-columns:1fr}}
.co-card{border:1px solid #fed7aa;background:#fff7ed;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.co-card .r1{display:flex;align-items:center;gap:10px;font-size:15px}
.co-card .pct{margin-left:auto;font-weight:700;color:#c2410c}
.co-card .bar{height:10px;border-radius:999px;background:#fde3d3;overflow:hidden}
.co-card .bar i{display:block;height:100%;background:var(--f-primary);border-radius:999px;transition:width .4s linear}
.co-card .meta{font-size:12px;color:#9a3412}
.co-card .note{display:flex;gap:6px;font-size:12px;color:#7c2d12;align-items:flex-start}
.co-card .note svg{width:14px;height:14px;flex:none;margin-top:2px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid #f3f3f3;border-top-color:#ff4301;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.amber-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500}
.amber-chip svg{width:14px;height:14px}
.co-stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--gray-200);border-radius:8px;background:rgba(249,250,251,.6)}
.co-stepper .st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-500)}
.co-stepper .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--gray-200);color:var(--gray-600)}
.co-stepper .on{color:#000;font-weight:600}.co-stepper .on .n{background:var(--f-primary);color:#fff}
.co-stepper .done{color:var(--gray-700)}.co-stepper .done .n{background:#56b733;color:#fff}
.co-stepper .ln{flex:1;min-width:16px;height:2px;background:var(--gray-200)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--gray-300);border-radius:8px;padding:22px 12px;background:#fff;cursor:pointer;text-align:center;font-size:13px;color:var(--gray-600)}
.dropzone svg{width:24px;height:24px;color:#e8542b}
.dropzone b{color:#e8542b}
.dropzone span{font-size:11px;color:var(--gray-500)}
.dropzone.over,.dropzone:hover{border-color:#e8542b;background:#fff7ed}
.co-warn{border:1px solid #fcd34d;background:#fffbeb;border-radius:8px;padding:14px 16px;font-size:13px;color:#78350f}
.co-warn ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.add-lbl{border:1px solid var(--gray-200);border-radius:4px;padding:4px 12px;font-size:12px;font-weight:500;background:#fff;white-space:nowrap}
.add-lbl:hover{background:var(--gray-50)}
.v .rx-box{border-style:dashed}
.img-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.img-tab{display:inline-flex;align-items:center;gap:4px;height:32px;min-width:40px;padding:0 10px;border:1px solid var(--gray-300);border-radius:6px;background:#fff;font-size:14px;font-weight:600;color:var(--gray-700)}
.img-tab.on{border-color:var(--f-primary);background:var(--f-primary);color:#fff}
.img-tab .ok{color:#16a34a;font-size:12px}.img-tab.on .ok{color:#fff}
.img-tab .todo{color:#f59e0b;font-size:16px;line-height:1}.img-tab.on .todo{color:#fff}
.img-tabs-l{font-size:12px;color:var(--gray-500);margin-left:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.thumb{border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;background:#fff}
.thumb .ph{position:relative;background:#1b1c1e;aspect-ratio:16/9}
.thumb .ph img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph .n{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--f-primary);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.thumb .meta{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12px;color:var(--gray-600)}
.thumb .meta .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--gray-800)}
.thumb .rm{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--gray-500)}
.thumb .rm:hover{background:var(--gray-100);color:#ef4444}
.thumb .rm svg{width:15px;height:15px}
.img-count{font-size:13px;font-weight:600;color:#b45309}
.img-count.ok{color:#15803d}
.xy{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gray-700)}
.xy .inp{width:80px}
.row-del{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--gray-500);margin:0 auto}
.row-del:hover{background:#fee2e2;color:#ef4444}
.row-del svg{width:16px;height:16px}
.kbd-tbl{width:100%;border-collapse:collapse;font-size:13px}
.kbd-tbl td{padding:6px 4px;border-bottom:1px solid var(--gray-100)}
.kbd-tbl kbd{display:inline-block;border:1px solid var(--gray-300);border-bottom-width:2px;border-radius:4px;padding:0 6px;font:12px ui-monospace,Menlo,monospace;background:var(--gray-50);margin-right:2px}
</style>
</head>

/* SelectInput replica (custom button + option list rendered in a fixed-position portal, like SelectInput.jsx:127-205,
   so lists are never clipped by tables or scroll containers). Used by both products. */
function mountSelect(el, { options, value, placeholder = 'Select Option', disabled = false, small = false, onChange }) {
  const cur = options.find((o) => o.id === value);
  el.classList.add('sel');
  el.innerHTML = `<button type="button" class="sel-btn ${small ? 'sm' : ''}" ${disabled ? 'disabled' : ''}>${cur ? `<span>${esc(cur.name)}</span>` : `<span class="ph">${esc(placeholder)}</span>`}${ICON.chev}</button>`;
  const btn = el.firstElementChild;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = btn.dataset.open === '1';
    closeAllSelects();
    if (wasOpen) return;
    const r = btn.getBoundingClientRect();
    const list = document.createElement('div');
    list.className = 'sel-list';
    list.innerHTML = options.map((o) => `<div class="sel-opt ${o.id === value ? 'on' : ''}" data-id="${esc(o.id)}">${esc(o.name)}</div>`).join('') || '<div class="sel-opt" style="pointer-events:none;color:#6b7280">No options</div>';
    list.style.left = r.left + 'px'; list.style.minWidth = Math.max(r.width, 160) + 'px';
    const below = window.innerHeight - r.bottom;
    if (below < 250 && r.top > below) list.style.bottom = (window.innerHeight - r.top + 4) + 'px'; else list.style.top = (r.bottom + 4) + 'px';
    list.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const o = ev.target.closest('.sel-opt');
      if (!o || !o.dataset.id) return;
      const opt = options.find((x) => String(x.id) === o.dataset.id);
      closeAllSelects();
      onChange && onChange(opt);
    });
    document.body.appendChild(list);
    btn.dataset.open = '1';
  });
}
function closeAllSelects() { $$('.sel-list').forEach((l) => l.remove()); $$('.sel-btn[data-open]').forEach((b) => delete b.dataset.open); }
document.addEventListener('scroll', (e) => { if (!(e.target.classList && e.target.classList.contains('sel-list'))) closeAllSelects(); }, true);

/* =====================================================================
   GT + format helpers
   ===================================================================== */
// Pattern syntax (same on Vision "Format" and Edge "Fielding → Patterns"):
//   \d = any number 0-9   \l = any letter a-z A-Z   \w = any letter or number   \. = any character
//   anything else is a constant character that must match exactly (\\ = a literal backslash).
const META = { d: { re: /[0-9]/, name: 'a number' }, l: { re: /[A-Za-z]/, name: 'a letter' }, w: { re: /[A-Za-z0-9]/, name: 'a letter or number' }, '.': { re: /[\s\S]/, name: 'any character' } };
function parsePattern(p) {
  const toks = [];
  for (let i = 0; i < p.length; i++) {
    if (p[i] !== '\\') { toks.push({ lit: p[i] }); continue; }
    const n = p[i + 1];
    if (n === undefined) return { err: 'Pattern ends with a lone "\\"' };
    if (META[n]) toks.push({ meta: n });
    else if (n === '\\') toks.push({ lit: '\\' });
    else return { err: `"\\${n}" is not a valid code — use \\d, \\l, \\w or \\.` };
    i++;
  }
  if (!toks.length) return { err: 'Pattern is empty' };
  return { toks };
}
function matchPattern(text, p) {
  const r = parsePattern(p);
  if (r.err) return { ok: false, msg: r.err, bad: true };
  if (text.length !== r.toks.length) return { ok: false, msg: `Should be ${r.toks.length} characters long — it is ${text.length}` };
  for (let i = 0; i < r.toks.length; i++) {
    const t = r.toks[i], c = text[i];
    if (t.meta && !META[t.meta].re.test(c)) return { ok: false, msg: `Character ${i + 1} ("${c}") should be ${META[t.meta].name}` };
    if (t.lit !== undefined && c !== t.lit) return { ok: false, msg: `Character ${i + 1} should be "${t.lit}"` };
  }
  return { ok: true, msg: 'Matches the pattern' };
}

  const V = store.vision;
  V.module.name = d.name;

  for (let i = 0; i < n; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  const out = applyGreyFilter(g, src.width, src.height, type, P || {});
  for (let i = 0; i < n; i++) { const v = clamp(Math.round(out[i]), 0, 255); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
  ctx.putImageData(id, 0, 0);
}

  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

/* ---------- GT rules (Matching Type + Ground Truth) ---------- */
function newFielding() { return { type: 'variable', acceptable: 'any', linesOn: false, lines: 1, patterns: [] }; }
function ruleFor(g, rules = store.edge.gtRules) {
  // First time Edge sees a label, it starts from the Vision values (new labels added on Edge start empty).
  const vg = store.vision.gts.find((x) => x.id === g.id) || {};
  if (!rules[g.id]) rules[g.id] = { type: vg.type || 'text', text: vg.text || '', fielding: clone(vg.fielding || newFielding()) };
  return rules[g.id];
}
function evalFielding(f, read) {
  if (f.type === 'variable') {
    const acc = ACCEPTABLE.find((a) => a.id === f.acceptable) || ACCEPTABLE[0];
    if (!read.length) return { ok: false, msg: 'Nothing to check' };
    const bi = [...read].findIndex((c) => !acc.re.test(c));
    return bi < 0 ? { ok: true, msg: acc.name } : { ok: false, msg: `Character ${bi + 1} ("${read[bi]}") is not allowed — ${acc.name.toLowerCase()}` };
  }
  const pats = f.patterns.filter((p) => p.pattern && !parsePattern(p.pattern).err);
  if (!pats.length) return { ok: false, msg: 'No valid pattern yet' };
  const hit = pats.find((p) => matchPattern(read, p.pattern).ok);
  return hit ? { ok: true, msg: `Matches pattern "${hit.name || 'unnamed'}"`, pattern: hit.name } : { ok: false, msg: pats.length === 1 ? matchPattern(read, pats[0].pattern).msg : 'Matches none of the patterns' };
}
// Text + Regex = the read must equal the GT text AND satisfy the regex.
function evalRule(rule, read) {
  if (rule.type !== 'regex') {
    const exp = (rule.text || '').replace(/\s+/g, '');
    if (!exp) return { ok: false, msg: 'No GT text set' };
    if (read !== exp) return { ok: false, msg: `Reads ${read}, GT text is ${rule.text}` };
  }
  if (rule.type !== 'text') { const f = evalFielding(rule.fielding, read); if (!f.ok) return f; return { ok: true, msg: rule.type === 'both' ? `Matches GT text · ${f.msg}` : f.msg }; }
  return { ok: true, msg: 'Matches GT text' };
}
function fieldingProblems(f) {
  const out = [];
  if (f.type === 'variable') { if (f.linesOn && !(f.lines >= 1)) out.push('Number of lines must be 1 or more'); return out; }
  if (!f.patterns.length) out.push('Add at least one pattern');
  f.patterns.forEach((p, i) => { if (!p.name.trim()) out.push(`Pattern ${i + 1} needs a name`); const e = parsePattern(p.pattern).err; if (e) out.push(`Pattern ${i + 1}: ${e}`); });
  return out;
}
function ruleProblems(rule) {
  const out = [];
  if (rule.type !== 'regex' && !rule.text.trim()) out.push('GT text is required');
  if (rule.type !== 'text') fieldingProblems(rule.fielding).forEach((m) => out.push(m));
  if (rule.type === 'both' && rule.text.trim() && !fieldingProblems(rule.fielding).length) { const f = evalFielding(rule.fielding, rule.text.replace(/\s+/g, '')); if (!f.ok) out.push(`GT text doesn't fit the regex — ${f.msg}`); }
  return out;
}
function fieldingSummary(f) {
  if (f.type === 'variable') return `Variable · ${(ACCEPTABLE.find((a) => a.id === f.acceptable) || ACCEPTABLE[0]).name.toLowerCase()}${f.linesOn ? ` · ${f.lines} line${f.lines > 1 ? 's' : ''}` : ''}`;
  const t = f.type === 'fixed' ? 'Fixed' : 'Flexible';
  if (!f.patterns.length) return `${t} · no patterns yet`;
  return `${t} · ${f.patterns.map((p) => p.pattern || '∅').join('  |  ')}`;
}

          <div style="border-top:1px solid #e5e7eb;padding:20px;display:flex;justify-content:flex-end;gap:12px"><button class="btn btn-lg btn-border" id="rx-cancel">Cancel</button><button class="btn btn-lg btn-flat" id="rx-save">Save</button></div>

/* ---------- Image filter: dropdown (+ strength for Blur / Contrast), image (left) vs preview (right) ---------- */

/* ---------- Changeover progress (shown inside the module) ---------- */
function tickProgress() {
  const run = store.edge.changeover;
  if (!run) return;
  const p = clamp((Date.now() - run.startedAt) / run.durationMs, 0, 1);
  if (p >= 1) { finishChangeover(); return; }
  const stage = CO_STAGES.filter(([t]) => p >= t).pop()[1];
  const leftMs = run.durationMs - (Date.now() - run.startedAt);
  const left = leftMs > 90000 ? `about ${Math.ceil(leftMs / 60000)} min left` : leftMs > 60000 ? 'about 1 min left' : `${Math.ceil(leftMs / 1000)} s left`;
  const bar = $('#co-bar'); if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
  const pct = $('#co-pct'); if (pct) pct.textContent = Math.floor(p * 100) + '%';
  const meta = $('#co-meta'); if (meta) meta.textContent = `${stage} · ${left} · started ${fmtTime(run.startedAt)}`;
}
function finishChangeover() {
  const E = store.edge, pd = E.changeover.pending;
  E.active = { images: pd.images, roi: pd.roi, changedAt: Date.now() };
  E.gtRules = pd.gtRules; E.thresholds = pd.thresholds; E.filter = pd.filter; E.readingMode = pd.readingMode; E.labels = pd.labels;
  E.changeover = null;
  eUI.saved = edgeSnapshot(); eUI.dirty = false; eUI.errors = [];
  console.log('[Print-OCR] Changeover complete — active config', buildConfig());
  toast('Changeover complete — the instance can be deployed again');
  if (store.tab === 'edge') renderEdge();
}
function startTicker() { if (!eUI.ticker) eUI.ticker = setInterval(() => { if (store.edge.changeover) tickProgress(); }, 400); }

/* ---------- CHANGEOVER WIZARD ---------- */
function openWizard() {
  const E = store.edge;
  eUI.co = {
    step: 0, errors: [], images: [], cur: 0, roi: null,
    sel: null, clip: null,
    labels: clone(edgeLabels()), rules: clone(E.gtRules), thresholds: clone(E.thresholds), filter: clone(E.filter), readingMode: effMode(),
    filtCanvas: document.createElement('canvas'),
  };
  renderEdge();
  $('#e-main').scrollTo({ top: 0 });
}
const curImg = (co) => co.images[co.cur];
// Characters in reading order: group boxes into lines (top to bottom), then left to right.
function readingOrder(A) {
  const lines = [];
  A.slice().sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2)).forEach((a) => {
    const cy = a.y + a.h / 2, line = lines.find((l) => Math.abs(l.cy - cy) < Math.max(l.h, a.h) / 2);
    if (line) line.items.push(a); else lines.push({ cy, h: a.h, items: [a] });
  });
  return lines.map((l) => l.items.sort((a, b) => a.x - b.x));
}
function overlapMap(A) {
  const m = {};
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) { const a = A[i], b = A[j]; if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) { (m[a.id] ||= []).push(j + 1); (m[b.id] ||= []).push(i + 1); } }
  return m;
}
// Changeover annotation is character-only (no labels, no GT): an image is done when it has boxes, every box has a character, and nothing overlaps.
function imageProblems(im) {
  const out = [];
  if (!im.annotations.length) return ['no character boxes yet'];
  const noChar = im.annotations.filter((a) => !a.char).length; if (noChar) out.push(`${noChar} box${noChar > 1 ? 'es have' : ' has'} no character`);
  if (Object.keys(overlapMap(im.annotations)).length) out.push('boxes overlap');
  return out;
}

function wizardErrors(co) {
  const errs = [];
  if (co.step === 0 && co.images.length < CO_MIN_IMAGES) errs.push(`Add at least ${CO_MIN_IMAGES} images — ${co.images.length} added so far.`);
  if (co.step === 2) co.images.forEach((im, i) => { const p = imageProblems(im); if (p.length) errs.push(`Image ${i + 1}: ${p.join(', ')}.`); });
  if (co.step === 3) {
    if (!co.labels.length) errs.push('Add atleast 1 OCR label');
    const le = labelErrors(co.labels);
    co.labels.forEach((g, i) => {
      if (le[g.id]) { errs.push(`Label ${i + 1}: ${le[g.id]}`); return; }
      if (co.readingMode === 'match') { const p = ruleProblems(ruleFor(g, co.rules)); if (p.length) errs.push(`"${g.label}": ${p[0]}`); }
    });
    ['detection', 'recognition'].forEach((k) => { if (co.thresholds[k] === '') errs.push(`Enter the ${k} confidence threshold.`); });
  }
  return errs;
}
function wizardNext() {
  const co = eUI.co;
  co.errors = wizardErrors(co);
  if (co.errors.length) { renderErrors(co.errors); $('#e-main').scrollTo({ top: 0, behavior: 'smooth' }); toast(co.errors[0], 'bad'); return; }
  if (co.step === 1) { co.images.forEach((im) => cropInto(im.roiCanvas, im.img, co.roi)); co.cur = 0; }
  if (co.step === CO_STEPS.length - 1) { startChangeover(); return; }
  co.step++; renderEdge(); $('#e-main').scrollTo({ top: 0 });
}
function startChangeover() {
  const co = eUI.co;
  store.edge.changeover = {
    startedAt: Date.now(), durationMs: eUI.demoSpeed ? CO_DEMO_MS : CO_REAL_MS,
    pending: {
      images: co.images.map((im) => ({ src: im.src, name: im.name, annotations: im.annotations.map((a) => ({ ...a })) })),
      roi: { ...co.roi }, labels: clone(co.labels), gtRules: clone(co.rules), thresholds: clone(co.thresholds), filter: clone(co.filter), readingMode: co.readingMode,
    },
  };
  eUI.co = null;
  startTicker();

}

/* Step 2 — Drag ROI (fixed to the search-area size from the Vision tree; move by dragging or by typing X / Y) */
let winUp1 = null, winUp3 = null, cvRedraw = null;
function coStepRoi(body, co) {
  const sa = store.vision.searchArea, M = store.vision.masterImage;
  const maxX = M.w - sa.w, maxY = M.h - sa.h;
  body.innerHTML = `
    <div class="grid12">
      <div class="c4"><div class="panel">
        <div class="prow"><span class="k">ROI size</span><span class="v ro">${sa.w} × ${sa.h} px</span></div>
        <div class="muted" style="margin-top:-14px">Same size as ${esc(sa.module)} in the Frinks Vision tree.</div>
        <div class="prow"><span class="k">Position</span><span class="v" style="display:flex;gap:8px">
          <label class="xy">X<input class="inp xs" id="roi-x" type="number" min="0" max="${maxX}" step="1" value="${co.roi.x}"></label>
          <label class="xy">Y<input class="inp xs" id="roi-y" type="number" min="0" max="${maxY}" step="1" value="${co.roi.y}"></label></span></div>

      </div></div>
      <div class="c8">${imageTabs(co, false)}
        <div class="cv-wrap" id="cv1-wrap"><canvas id="cv1"></canvas>
        <div class="cv-pill"><span class="dot"></span>Drag the orange box over the printed code</div></div></div>
    </div>`;
  bindImageTabs(body, co, () => coStepRoi(body, co));

  const draw = () => {
    const { ctx, w, h } = fitCanvas(cv), iw = im.img.naturalWidth, ih = im.img.naturalHeight;
    const s = Math.min((w - 24) / iw, (h - 24) / ih), ox = (w - iw * s) / 2, oy = (h - ih * s) / 2;
    st = { s, ox, oy };

    ctx.drawImage(im.img, ox, oy, iw * s, ih * s);
    const rx = ox + co.roi.x * s, ry = oy + co.roi.y * s, rw = sa.w * s, rh = sa.h * s;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.rect(ox, oy, iw * s, ih * s); ctx.rect(rx, ry, rw, rh); ctx.fill('evenodd');
    ctx.lineWidth = 2; ctx.strokeStyle = '#e8542b'; ctx.setLineDash([8, 5]); ctx.strokeRect(rx, ry, rw, rh); ctx.setLineDash([]);
    const tag = `ROI · ${sa.w} × ${sa.h} px`; ctx.font = '600 12px Outfit, sans-serif';
    const tw = ctx.measureText(tag).width + 12; ctx.fillStyle = '#e8542b'; ctx.fillRect(rx, Math.max(0, ry - 20), tw, 20);
    ctx.fillStyle = '#fff'; ctx.fillText(tag, rx + 6, Math.max(0, ry - 20) + 14);
  };
  const hadBoxes = () => co.images.some((x) => x.annotations.length);
  const setRoi = (x, y) => {
    x = clamp(Math.round(x), 0, maxX); y = clamp(Math.round(y), 0, maxY);
    if (x === co.roi.x && y === co.roi.y) return;
    if (hadBoxes()) { co.images.forEach((x2) => { x2.annotations = []; x2.view = null; }); toast('Character boxes were cleared because the ROI moved', 'info'); }
    co.roi.x = x; co.roi.y = y;

  };
  const toImg = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - st.ox) / st.s, y: (e.clientY - r.top - st.oy) / st.s }; };
  const inRoi = (p) => p.x >= co.roi.x && p.x <= co.roi.x + sa.w && p.y >= co.roi.y && p.y <= co.roi.y + sa.h;
  cv.addEventListener('mousedown', (e) => { const p = toImg(e); if (inRoi(p)) drag = { dx: p.x - co.roi.x, dy: p.y - co.roi.y }; });
  cv.addEventListener('mousemove', (e) => { const p = toImg(e); if (drag) setRoi(p.x - drag.dx, p.y - drag.dy); else cv.style.cursor = inRoi(p) ? 'move' : 'default'; });

function buildConfig() {

  return {
    module: { name: V.module.name, type: 'print-ocr' },
    readingMode: mode === 'match' ? 'read-and-match' : 'read-only',
    searchArea: { w: V.searchArea.w, h: V.searchArea.h },
    roi: E.active.roi ? { ...E.active.roi } : { x: V.searchArea.x, y: V.searchArea.y },
    filter: { type, params },
    gts: edgeLabels().map((g) => {
      if (mode !== 'match') return { label: g.label };
      const r = ruleFor(g);
      return { label: g.label, matchingType: { text: 'text', regex: 'regex', both: 'text+regex' }[r.type], groundTruth: { text: r.type === 'regex' ? null : r.text, regex: r.type === 'text' ? null : rx(r.fielding) } };
    }),

    thresholds: { detection: Number(E.thresholds.detection), recognition: Number(E.thresholds.recognition) },

}

  host.innerHTML = `<div class="e-modal-ov"><div class="e-modal">
    <div class="mh"><span>Keyboard Shortcuts</span><button id="ks-x">${ICON.close}</button></div>
    <div class="mb"><table class="kbd-tbl">${rows.map(([k, v]) => `<tr><td style="white-space:nowrap">${k}</td><td>${v}</td></tr>`).join('')}</table></div>
  </div></div>`;
  const close = () => { host.innerHTML = ''; $('#cv3-wrap')?.focus({ preventScroll: true }); };
  $('#ks-x').onclick = close;
  $('.e-modal-ov', host).addEventListener('click', (e) => { if (e.target.classList.contains('e-modal-ov')) close(); });
}

/* =====================================================================
   Tabs + boot
   ===================================================================== */
function setTab(t) {
  store.tab = t;
  closeAllSelects();
  $$('#proto-bar .pb-tab[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  $('#app-vision').hidden = t !== 'vision';
  $('#app-edge').hidden = t !== 'edge';
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// in some browsers */ }
  if (t === 'edge') renderEdge(); else renderVision();
}
$$('#proto-bar .pb-tab[data-tab]').forEach((b) => b.onclick = () => setTab(b.dataset.tab));
function renderSpeed() { $$('#proto-bar .pb-speed').forEach((b) => b.classList.toggle('on', (b.dataset.s === 'demo') === eUI.demoSpeed)); }
$$('#proto-bar .pb-speed').forEach((b) => b.onclick = () => { eUI.demoSpeed = b.dataset.s === 'demo'; renderSpeed(); });
$('#pb-reset').onclick = () => {
  store = freshStore();
  Object.assign(vUI, { panelOpen: false, step: 0, draft: null, showErr: false, zoom: 1, picker: false });
  Object.assign(eUI, { co: null, saved: null, dirty: false, errors: [] });
  $('#modal-host').innerHTML = '';
  setTab('vision');
  toast('Demo reset', 'info');
};
let rsz;
window.addEventListener('resize', () => { closeAllSelects(); clearTimeout(rsz); rsz = setTimeout(() => { if (store.tab === 'edge' && cvRedraw && ($('#cv1') || $('#cv3'))) cvRedraw(); }, 80); });
renderSpeed();
setTab(location.hash === '#edge' ? 'edge' : 'vision');

</script>
</body>
</html>
